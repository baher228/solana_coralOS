# Production-like stack: PostgreSQL + API + nginx(web). Secrets come from the
# environment / your secret manager -- do NOT bake them into images.
#
#   OPERATOR_TOKEN=... POSTGRES_PASSWORD=... docker compose -f deploy/docker/docker-compose.yml up --build
#
# Terminate TLS in front (the nginx-txodds-tls.conf sample or a load balancer).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-txodds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-txodds}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-txodds}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      PORT: "8801"
      DATABASE_URL: postgres://${POSTGRES_USER:-txodds}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-txodds}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?set OPERATOR_TOKEN}
      DISABLE_DEMO: "1"
      REVIEW_ALLOW_CODE_EXECUTION: "0"
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      # Provide signing keys via your secret manager, not the image.
      BUYER_KEYPAIR_B58: ${BUYER_KEYPAIR_B58:-}
      ARBITER_KEYPAIR_B58: ${ARBITER_KEYPAIR_B58:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8801"
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
