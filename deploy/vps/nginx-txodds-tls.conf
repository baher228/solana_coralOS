# HTTPS reverse proxy for the Freelance Escrow Platform.
#
# 1. Point DNS at the box and set YOUR_DOMAIN below.
# 2. Obtain a certificate:  sudo certbot --nginx -d YOUR_DOMAIN
# 3. sudo nginx -t && sudo systemctl reload nginx
#
# X-Forwarded-* headers are forwarded so the API's rate limiter and links see the
# real client IP and scheme.

server {
    listen 80;
    server_name YOUR_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    root /opt/solana_coralOS/examples/txodds/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8801;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:8801/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /previews/ {
        alias /var/lib/txodds/previews/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
