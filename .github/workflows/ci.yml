name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runtime:
    name: Agent runtime (packages/agent-runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: cd packages/agent-runtime && npm install
      - run: cd packages/agent-runtime && npm run typecheck
      - run: cd packages/agent-runtime && npm test

  txodds:
    name: Freelance Escrow Platform (typecheck + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: txodds
          POSTGRES_PASSWORD: txodds
          POSTGRES_DB: txodds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://txodds:txodds@127.0.0.1:5432/txodds_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Build the runtime (the example needs its dist)
        run: cd packages/agent-runtime && npm install && npm run build
      - name: Install deps
        run: cd examples/txodds && npm install
      - name: Lint
        run: cd examples/txodds && npm run lint
      - name: Typecheck
        run: cd examples/txodds && npm run typecheck
      - name: Tests (incl. PostgreSQL persistence)
        run: cd examples/txodds && npm test
      - name: Web production build
        run: cd examples/txodds && npm run web:build

  escrow-program:
    name: Escrow program (SBF build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install Solana toolchain (cargo-build-sbf)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build program to SBF bytecode
        run: cd examples/txodds/escrow && cargo-build-sbf
