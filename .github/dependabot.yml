version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /scripts
      - /packages/agent-runtime
      - /examples/txodds
      - /examples/txodds/escrow
      - /agents/demo-worker
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /examples/txodds/escrow
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
